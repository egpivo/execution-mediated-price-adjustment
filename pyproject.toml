[project]
name = "research-core"
version = "0.1.0"
description = "Reproducible data + methods core for \"Price Adjustment When Updating Requires Execution: Evidence from Automated Market Makers\""
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "duckdb>=0.10",
    "orjson>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
